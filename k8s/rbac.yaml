apiVersion: v1
kind: ServiceAccount
metadata:
  name: apex-backend-sa
  namespace: apex-solutions
  annotations:
    # Cloud Workload Identity integration: Map to a standard cloud service account instead of long-lived secret tokens
    iam.gke.io/gcp-service-account: "apex-backend@smartcampus-8c327.iam.gserviceaccount.com"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apex-backend-role
  namespace: apex-solutions
rules:
  # Strict Least-Privilege Rules: Absolutely zero wildcard (*) permissions
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["apex-vault-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apex-backend-role-binding
  namespace: apex-solutions
subjects:
  - kind: ServiceAccount
    name: apex-backend-sa
    namespace: apex-solutions
roleRef:
  kind: Role
  name: apex-backend-role
  apiGroup: rbac.authorization.k8s.io
